name: CI - Build & Test

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'hotfix/**'
      - 'dev/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Checks
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Integration & Unit Tests
        run: npm run test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://prtuehndaifjcdzomrrd.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBydHVlaG5kYWlmamNkem9tcnJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDU2ODcsImV4cCI6MjEwNDc4MTY4N30.4jT8BypwoHwjFGA4DFEJUl-i-SB-Yry9_V53gqsZpsM' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@ustaadlink.pk' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'UstaadLinkAdmin2026!' }}
